AWSTemplateFormatVersion: 2010-09-09 
Description: CD pipeline for saivajra ticket integration 
 
Parameters: 
  ProjectName: 
    Type: String 
    Default: saivajra-ticket-integration 
  CapitalizedProjectName: 
    Type: String 
    Default: saivajra-ticket-integration 
  GitHubOwner:
    Type: String
    Description: GitHub username or org
  GitHubRepo:
    Type: String
    Description: GitHub repository name
  GitHubBranch:
    Type: String
    Default: main
  GitHubTokenSecretName:
    Type: String
    Description: Secrets Manager secret name storing GitHub PAT
  EcrRepoName:
    Type: String 
    Default: give ecr repo name  
  ArtifactsBucket:
    Type: String
    Default: give existing s3 bucket.  
  ExportLambdaRoleName: 
    Type: String 
    Default: give lambda role name
Resources: 
  EventRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source:
          - aws.codecommit
        detail-type:
          - 'CodeCommit Repository State Change'
        resources:
          - !Join [ '', [ 'arn:aws:codecommit:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':', !Ref SourceRepositoryName ] ]
        detail:
          event:
            - referenceCreated
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - !Ref SourceBranchName
      Targets:
        -
          Arn: 
            !Join [ '', [ 'arn:aws:codepipeline:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':', !Ref CodePipeline ] ]
          RoleArn: !Join [ '', [ 'arn:aws:iam::', !Ref 'AWS::AccountId', ':', 'role', '/', 'saivajra-codepipeline-event-role' ] ]
          Id: codepipeline-AppPipeline
  CodeBuildProject: 
    Type: AWS::CodeBuild::Project 
    Properties: 
      Artifacts: 
        Type: CODEPIPELINE 
      Environment: 
        ComputeType: BUILD_GENERAL1_SMALL 
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Type: PLAINTEXT
            Value: 'ap-south-1'
          - Name: AWS_ACCOUNT_ID
            Type: PLAINTEXT
            Value: '610481099460'
          - Name: IMAGE_REPO_NAME
            Type: PLAINTEXT
            Value: !Sub '${EcrRepoName}'
          - Name: IMAGE_TAG
            Type: PLAINTEXT
            Value: 'latest'
        Image: aws/codebuild/standard:2.0 
        Type: LINUX_CONTAINER 
        PrivilegedMode: true
      Name: !Sub '${ProjectName}-stg' 
      ServiceRole:
        Fn::ImportValue: !Sub '${ExportLambdaRoleName}' 
      Source: 
        BuildSpec: 'buildspec.yml' 
        Type: CODEPIPELINE 
      TimeoutInMinutes: 480 # must be between 5 minutes and 8 hours 
 
 
  CodePipeline: 
    Type: AWS::CodePipeline::Pipeline 
    Properties: 
      ArtifactStore: 
        Type: S3 
        Location: !Ref ArtifactsBucket 
      Name: !Sub '${ProjectName}-stg' 
      RestartExecutionOnUpdate: true 
      RoleArn:
        Fn::ImportValue: !Sub '${ExportLambdaRoleName}' 
      Stages: 
        - Name: Source 
          Actions: 
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: "1"
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                Owner: !Ref GitHubOwner
                Repo: !Ref GitHubRepo
                Branch: !Ref GitHubBranch
                OAuthToken: !Sub "${GitHubTokenSecretName}"
                PollForSourceChanges: false 
              Namespace: SourceVariables   
        - Name: StagingBuild 
          Actions: 
            - Name: StgBuildAndTest 
              ActionTypeId: 
                Category: Build 
                Owner: AWS 
                Provider: CodeBuild 
                Version: '1' 
              Configuration: 
                ProjectName: !Ref CodeBuildProject 
              InputArtifacts: 
                - Name: SourceOutput 
              OutputArtifacts: 
                - Name: BuildOutput  
              Namespace: BuildVariables   
        - Name: StagingCreateChangeSet 
          Actions: 
            - Name: StgCreateUpdateLambda 
              ActionTypeId: 
                Category: Deploy 
                Owner: AWS 
                Provider: CloudFormation 
                Version: '1' 
              Configuration: 
                ActionMode: CHANGE_SET_REPLACE  
                Capabilities: CAPABILITY_IAM    
                ChangeSetName: !Sub '${ProjectName}-stg-changeset' 
                RoleArn: 
                  Fn::ImportValue: !Sub '${ExportLambdaRoleName}' 
                StackName: !Sub '${ProjectName}-STG' 
                TemplatePath: SourceOutput::lambdatemplates/staginglambda.yml
                TemplateConfiguration: SourceOutput::lambda-function/stagingconfig.json 
                ParameterOverrides: '{"DeploymentPackageKey": {"Fn::GetArtifactAtt": ["BuildOutput", "ObjectKey"]}, "GitCommitId": "#{SourceVariables.CommitId}"}' 
              InputArtifacts: 
                - Name: SourceOutput 
                - Name: BuildOutput
        - Name: StagingLambdaDeploy 
          Actions: 
            - Name: StgDeployLambda 
              ActionTypeId: 
                Category: Deploy 
                Owner: AWS 
                Provider: CloudFormation 
                Version: '1' 
              Configuration: 
                ActionMode: CHANGE_SET_EXECUTE  
                ChangeSetName: !Sub '${ProjectName}-stg-changeset'  
                StackName: !Sub '${ProjectName}-STG' 
              InputArtifacts: 
                - Name: SourceOutput 
                - Name: BuildOutput         
        
Outputs: 
  ArtifactsBucket: 
    Description: S3 bucket holding all the OutputArtifacts of any pipeline stage 
    Value: !Ref ArtifactsBucket 
    Export: 
      Name: !Sub '${CapitalizedProjectName}PipelineArtifactsBucket'
  PipelineUrl:
    Value: !Sub https://console.aws.amazon.com/codepipeline/home?region=${AWS::Region}#/view/${CodePipeline}
    Description: CodePipeline URL